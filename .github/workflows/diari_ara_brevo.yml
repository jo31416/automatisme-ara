name: Descarrega i envia el Diari Ara (Brevo)

on:
  workflow_dispatch:
jobs:
  descarrega-i-envia:
    runs-on: ubuntu-latest

    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·la dependències
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Executa l'script
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_FROM: ${{ secrets.BREVO_FROM }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          DESTINATARIS: ${{ secrets.DESTINATARIS }}
          ARA_USUARI: ${{ secrets.ARA_USUARI }}
          ARA_PASSWORD: ${{ secrets.ARA_PASSWORD }}
        run: python descarrega_ara_brevo.py
