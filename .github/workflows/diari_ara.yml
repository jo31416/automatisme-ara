name: Descarrega i envia el Diari Ara

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  descarrega-i-envia:
    runs-on: ubuntu-latest

    steps:
      - name: Descarrega el codi
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·la dependències
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Verifica secrets
        env:
          ARA_USUARI: ${{ secrets.ARA_USUARI }}
          ARA_PASSWORD: ${{ secrets.ARA_PASSWORD }}
          GMAIL_USUARI: ${{ secrets.GMAIL_USUARI }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          DESTINATARIS: ${{ secrets.DESTINATARIS }}
        run: |
          echo "ARA_USUARI buit?: $([ -z "$ARA_USUARI" ] && echo SI || echo NO)"
          echo "ARA_PASSWORD buit?: $([ -z "$ARA_PASSWORD" ] && echo SI || echo NO)"
          echo "GMAIL_USUARI buit?: $([ -z "$GMAIL_USUARI" ] && echo SI || echo NO)"
          echo "GMAIL_PASSWORD buit?: $([ -z "$GMAIL_PASSWORD" ] && echo SI || echo NO)"
          echo "DESTINATARIS buit?: $([ -z "$DESTINATARIS" ] && echo SI || echo NO)"

      - name: Executa l'script
        env:
          GMAIL_USUARI: ${{ secrets.GMAIL_USUARI }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          DESTINATARIS: ${{ secrets.DESTINATARIS }}
          ARA_USUARI: ${{ secrets.ARA_USUARI }}
          ARA_PASSWORD: ${{ secrets.ARA_PASSWORD }}
        run: python descarrega_ara.py
